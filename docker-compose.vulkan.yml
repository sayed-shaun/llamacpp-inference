services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-server-vulkan
    command: ${EXTRA_ARGS:-}
    ports:
      - "${PORT:-8080}:8080"
    environment:
      LLAMA_ARG_HF_REPO: ${HF_REPO}
      LLAMA_ARG_HF_FILE: ${HF_FILE}
      HF_TOKEN: ${HF_TOKEN:-}

      LLAMA_CACHE: /models

      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_N_PARALLEL: ${PARALLEL:-4}
      LLAMA_ARG_CTX_SIZE: ${CTX_SIZE:-16384}
      LLAMA_ARG_N_GPU_LAYERS: ${NGL:-99}
      LLAMA_ARG_FLASH_ATTN: ${FLASH_ATTN:-on}

    volumes:
      - llama-models:/models

    # GPU access for AMD / Intel.
    devices:
      - /dev/dri:/dev/dri
      # - /dev/kfd:/dev/kfd   # AMD only
    group_add:
      - video
      - render

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

volumes:
  llama-models:
